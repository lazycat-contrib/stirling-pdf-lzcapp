application:
  subdomain: stirling-pdf
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://stirling-pdf:8080/
services:
  stirling-pdf:
    # upstream: stirlingtools/stirling-pdf:2.14.2
    image: docker.1ms.run/stirlingtools/stirling-pdf:2.14.2
    binds:
      - /lzcapp/var/configs:/configs
